<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1216">
  <title>Spit Control</title>
  <style>
    :root {
      --bg: #0f1216; --panel: #181c22; --panel-2: #21262e; --border: #2a313b;
      --text: #e6edf3; --muted: #8b95a3; --accent: #4cc2ff; --accent-2: #2aa6e6;
      --good: #36d399; --warn: #fbbd23; --bad: #ef4444; --tap: 56px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
      font-size: 16px; -webkit-user-select: none; user-select: none;
      overscroll-behavior: none; -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
    }
    input, textarea { -webkit-user-select: text; user-select: text; }
    button { font-family: inherit; }
    body { min-height: 100vh; display: flex; flex-direction: column; }

    /* ---------- Header ---------- */
    header {
      display: grid; grid-template-columns: auto 1fr auto; align-items: center;
      gap: 16px; padding: 10px 16px; background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .brand { font-weight: 800; letter-spacing: 4px; color: var(--muted); font-size: 15px; }
    .topgroup { display: flex; gap: 12px; align-items: center; justify-content: center; }
    .connbox {
      display: inline-flex; gap: 8px; align-items: center;
      color: var(--muted); font-size: 13px;
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 999px; padding: 6px 12px 6px 10px;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%; background: var(--muted);
      box-shadow: 0 0 0 0 transparent;
      transition: background .2s ease, box-shadow .3s ease;
    }
    .dot.ok  { background: var(--good); box-shadow: 0 0 0 4px rgba(54,211,153,.18); }
    .dot.bad { background: var(--bad);  box-shadow: 0 0 0 4px rgba(239,68,68,.18); }

    .seg {
      display: inline-flex; background: var(--panel-2);
      border-radius: 12px; padding: 4px; border: 1px solid var(--border);
      gap: 2px;
    }
    .seg button {
      height: var(--tap); min-width: 110px; background: transparent;
      border: 0; color: var(--muted); font-size: 17px; font-weight: 600;
      border-radius: 8px; padding: 0 18px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .15s ease, color .15s ease;
    }
    .seg button:hover { color: var(--text); }
    .seg button.active { background: var(--accent); color: #001018; }
    .seg button.active:hover { color: #001018; }
    .seg .ic { font-size: 18px; line-height: 1; }

    .big {
      height: var(--tap); padding: 0 28px; background: var(--good);
      color: #00210e; border: 0; border-radius: 12px;
      font-size: 22px; font-weight: 800; letter-spacing: 2px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 10px;
      transition: background .15s ease, transform .05s ease;
    }
    .big:active { transform: scale(.97); }
    .big.running { background: var(--bad); color: #2a0606; }
    .big .ic {
      width: 22px; height: 22px; border-radius: 50%;
      border: 3px solid currentColor; position: relative;
    }
    .big .ic::after {
      content: ""; position: absolute; left: 50%; top: -6px;
      width: 3px; height: 10px; background: currentColor; transform: translateX(-50%);
    }
    .big.running .ic { border-radius: 4px; border: 0; background: currentColor; }
    .big.running .ic::after { display: none; }

    /* ---------- Main ---------- */
    main {
      flex: 1; display: grid; grid-template-columns: 1.15fr 1fr;
      gap: 16px; padding: 16px;
    }

    .readouts {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .compass-block {
      display: grid; grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px; align-items: center;
    }
    .compass-wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    #compass { width: 100%; max-width: 280px; aspect-ratio: 1; }
    .ring { fill: var(--panel-2); stroke: var(--border); stroke-width: 2; }
    .ticks line { stroke: var(--muted); stroke-width: 1; }
    .ticks line.major { stroke: var(--text); stroke-width: 2.5; }
    .cardinal {
      fill: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 1px;
      text-anchor: middle; dominant-baseline: middle;
    }
    .cardinal.north { fill: var(--accent); }
    .needle line { stroke: var(--accent); stroke-width: 5; stroke-linecap: round; }
    .needle circle { fill: var(--accent); }
    #needle, #target-needle { transition: transform .25s ease-out; }
    .target line { stroke: var(--warn); stroke-width: 3; stroke-dasharray: 5 5; stroke-linecap: round; }
    .angle-readout {
      display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 4px;
    }
    .angle-label { font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -1px; }
    .angle-label .unit { color: var(--muted); font-weight: 400; }
    .angle-multi {
      color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 1px;
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 999px; padding: 3px 10px;
    }

    .stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
    }
    .stat {
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .stat-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
    .stat-value { font-size: 26px; font-weight: 700; line-height: 1.1; }
    .stat-value .unit { color: var(--muted); font-size: 14px; font-weight: 400; margin-left: 2px; }

    /* ---------- Controls ---------- */
    .controls {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px;
      display: flex; flex-direction: column; gap: 14px;
      min-height: 0;
    }
    .control-mode { display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0; }
    .control-mode > label {
      color: var(--muted); font-size: 11px; text-transform: uppercase;
      letter-spacing: 1.5px; font-weight: 700;
    }
    .control-mode .row { display: flex; align-items: center; gap: 10px; }
    .control-mode .row .hint { color: var(--muted); font-size: 13px; }

    .slider-block {
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .slider-meta {
      display: flex; justify-content: space-between; align-items: baseline;
      color: var(--muted); font-size: 12px; letter-spacing: 1px;
    }
    .slider-meta .current { color: var(--text); font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }

    input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 16px;
      background: var(--bg); border-radius: 999px; border: 1px solid var(--border);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 44px; height: 44px;
      border-radius: 50%; background: var(--accent);
      border: 3px solid var(--panel-2); cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    input[type="range"]::-moz-range-thumb {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--accent); border: 3px solid var(--panel-2); cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }

    input[type="number"] {
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; font-size: 20px; min-width: 110px;
      -moz-appearance: textfield;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input[type="number"]:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(76,194,255,.18);
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    .knob-block {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px;
    }
    #knob { width: 100%; max-width: 280px; aspect-ratio: 1; touch-action: none; }
    .knob-handle line { stroke: var(--warn); stroke-width: 5; stroke-linecap: round; }
    .knob-handle circle { fill: var(--warn); stroke: var(--bg); stroke-width: 2; }
    .knob-current line { stroke: var(--accent); stroke-width: 3; stroke-dasharray: 3 4; }
    #knob-current, #knob-handle { transition: transform .15s ease-out; }
    .knob-block .row { width: 100%; justify-content: center; }
    .knob-block input[type="number"] { text-align: center; }

    .hidden { display: none !important; }

    /* ---------- Tuning ---------- */
    .tuning { background: var(--panel); border-top: 1px solid var(--border); padding: 0 16px 16px; }
    .tuning summary {
      cursor: pointer; padding: 14px 12px; color: var(--muted);
      font-size: 12px; text-transform: uppercase; letter-spacing: 2px; font-weight: 700;
      list-style: none; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid transparent;
    }
    .tuning summary::-webkit-details-marker { display: none; }
    .tuning summary::before {
      content: ""; width: 8px; height: 8px;
      border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
      transform: rotate(-45deg); transition: transform .2s ease;
    }
    .tuning[open] summary::before { transform: rotate(45deg); }
    .tuning[open] summary { border-bottom-color: var(--border); margin-bottom: 12px; }

    .tune-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    fieldset {
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px; margin: 0;
    }
    legend { color: var(--muted); padding: 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    fieldset label {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; margin: 8px 0; font-size: 14px;
    }
    fieldset input[type="number"] { width: 130px; padding: 8px 10px; font-size: 15px; }
    button.ghost, button.primary {
      height: 48px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--panel-2); color: var(--text);
      font-size: 15px; font-weight: 600; cursor: pointer; padding: 0 18px;
      width: 100%; margin-top: 6px;
      transition: filter .15s ease, transform .05s ease;
    }
    button.ghost:hover, button.primary:hover { filter: brightness(1.1); }
    button.ghost:active, button.primary:active { transform: scale(.98); }
    button.primary { background: var(--accent); color: #001018; border-color: var(--accent); }
    .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }

    /* ---------- Disconnect state ---------- */
    body.disconnected .stat-value,
    body.disconnected .angle-label,
    body.disconnected .slider-meta .current { opacity: .35; }

    /* ---------- Responsive ---------- */
    @media (max-height: 620px) {
      .stat-value { font-size: 22px; }
      #compass { max-width: 220px; }
      .seg button { min-width: 92px; font-size: 16px; }
      .big { font-size: 18px; padding: 0 18px; }
      .angle-label { font-size: 32px; }
    }

    /* Tablet 1024×600 — keep horizontal compass+stats but make compact */
    @media (min-width: 820px) and (max-height: 700px) {
      .compass-block { grid-template-columns: 1fr; }
    }

    /* Phones — portrait & narrow */
    @media (max-width: 720px) {
      :root { --tap: 52px; }
      header {
        grid-template-columns: 1fr auto;
        grid-template-areas: "brand conn" "top top";
        gap: 10px; padding: 10px 12px;
      }
      .brand   { grid-area: brand; font-size: 14px; letter-spacing: 3px; }
      .connbox { grid-area: conn; justify-self: end; }
      .topgroup {
        grid-area: top; display: grid; grid-template-columns: 1fr 1fr;
        gap: 8px; width: 100%;
      }
      .topgroup .seg { width: 100%; }
      .topgroup .seg button { min-width: 0; flex: 1; padding: 0 8px; font-size: 16px; }
      #startstop { grid-column: 1 / -1; width: 100%; font-size: 20px; justify-content: center; }
      main { grid-template-columns: 1fr; gap: 12px; padding: 12px; }
      .compass-block { grid-template-columns: 1fr; }
      #compass { max-width: 240px; }
      .stat-value { font-size: 22px; }
      .controls { padding: 14px; } #knob { max-width: 240px; }
      .tune-grid { grid-template-columns: 1fr; }
      fieldset label { flex-wrap: wrap; }
      fieldset input[type="number"] { width: 100%; }
    }
    @media (max-width: 380px) {
      .topgroup { grid-template-columns: 1fr; } .topgroup .seg { width: 100%; }
      .angle-label { font-size: 30px; } .stat-value { font-size: 20px; }
      .stats { grid-template-columns: 1fr 1fr; }
      .stats .stat:first-child { grid-column: 1 / -1; }
    }
    /* Phone landscape */
    @media (max-width: 900px) and (orientation: landscape) and (max-height: 500px) {
      main { grid-template-columns: 1.2fr 1fr; }
      .compass-block { grid-template-columns: 1fr; gap: 8px; }
      #compass { max-width: 150px; }
      .angle-label { font-size: 22px; }
      .stat-value { font-size: 18px; }
      .stat { padding: 8px 10px; }
      .tuning summary { padding: 8px 4px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">SPIT</div>
    <div class="topgroup">
      <div class="seg" id="mode-seg" role="tablist" aria-label="Control mode">
        <button data-mode="0" class="active" role="tab"><span class="ic">⇋</span>Velocity</button>
        <button data-mode="1" role="tab"><span class="ic">◎</span>Position</button>
      </div>
      <div class="seg" id="dir-seg" role="tablist" aria-label="Direction">
        <button data-dir="0" class="active" role="tab"><span class="ic">↻</span>Fwd</button>
        <button data-dir="1" role="tab"><span class="ic">↺</span>Rev</button>
      </div>
      <button id="startstop" class="big start" aria-pressed="false">
        <span class="ic" aria-hidden="true"></span><span class="lbl">START</span>
      </button>
    </div>
    <div class="connbox" aria-live="polite">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-text">connecting…</span>
    </div>
  </header>

  <main>
    <section class="readouts">
      <div class="compass-block">
        <div class="compass-wrap">
          <svg id="compass" viewBox="-118 -118 236 236" aria-label="Spit angle">
            <circle class="ring" r="100"></circle>
            <g class="ticks" id="ticks"></g>
            <text class="cardinal north" y="-110">N</text>
            <text class="cardinal" x="110" y="2">E</text>
            <text class="cardinal" y="114">S</text>
            <text class="cardinal" x="-110" y="2">W</text>
            <g id="target-needle" class="target hidden">
              <line x1="0" y1="0" x2="0" y2="-88"></line>
            </g>
            <g id="needle" class="needle">
              <line x1="0" y1="0" x2="0" y2="-86"></line>
              <circle r="7"></circle>
            </g>
          </svg>
          <div class="angle-readout">
            <div class="angle-label"><span id="angle-deg">0.0</span><span class="unit">°</span></div>
            <div class="angle-multi" id="angle-multi">+0.00 turns</div>
          </div>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Rounds</div>
          <div class="stat-value" id="num-rounds">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Measured</div>
          <div class="stat-value" id="vel-meas">0.0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Sent</div>
          <div class="stat-value" id="vel-sent">0.0</div>
        </div>
      </div>
    </section>

    <section class="controls">
      <div class="control-mode" id="ctl-vel">
        <label>Velocity setpoint</label>
        <div class="slider-block">
          <div class="slider-meta"><span>0</span><span class="current" id="vel-current">0.0</span><span>100</span></div>
          <input type="range" id="vel-slider" min="0" max="100" step="0.5" value="0">
        </div>
        <div class="row">
          <input type="number" id="vel-num" min="0" max="200" step="0.5" value="0">
          <span class="hint">drag or type a value</span>
        </div>
      </div>

      <div class="control-mode hidden" id="ctl-pos">
        <label>Position target</label>
        <div class="knob-block">
          <svg id="knob" viewBox="-118 -118 236 236" aria-label="Position target knob">
            <circle class="ring" r="100"></circle>
            <g class="ticks" id="knob-ticks"></g>
            <text class="cardinal north" y="-110">N</text>
            <text class="cardinal" x="110" y="2">E</text>
            <text class="cardinal" y="114">S</text>
            <text class="cardinal" x="-110" y="2">W</text>
            <g id="knob-current" class="knob-current">
              <line x1="0" y1="0" x2="0" y2="-74"></line>
            </g>
            <g id="knob-handle" class="knob-handle">
              <line x1="0" y1="0" x2="0" y2="-86"></line>
              <circle cx="0" cy="-92" r="14"></circle>
            </g>
          </svg>
          <div class="row">
            <input type="number" id="pos-num" step="1" value="0">
            <span class="hint">multi-turn ok</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <details class="tuning">
    <summary>Tuning &amp; settings</summary>
    <div class="tune-grid">
      <fieldset>
        <legend>Velocity PID</legend>
        <label>P gain<input type="number" id="P_gain" step="0.01" min="0" max="5"></label>
        <label>I action<input type="number" id="I_action" step="0.01" min="0" max="15"></label>
        <label>Feed-forward<input type="number" id="feed_forward" step="0.01"></label>
      </fieldset>
      <fieldset>
        <legend>Position PID</legend>
        <label>pos P<input type="number" id="pos_P_gain" step="0.01" min="0" max="10"></label>
        <label>pos I<input type="number" id="pos_I_action" step="0.01" min="0" max="10"></label>
        <label>pos D<input type="number" id="pos_D_gain" step="0.01" min="0" max="100"></label>
        <label>max vel<input type="number" id="pos_max_vel" step="1" min="0" max="1000"></label>
        <label>max accel<input type="number" id="pos_max_accel" step="0.1" min="0.1" max="1000"></label>
      </fieldset>
      <fieldset>
        <legend>Encoder</legend>
        <label>counts / rev<input type="number" id="counts_per_rev" step="1" min="1"></label>
        <button id="set-home" class="ghost">Set Home</button>
      </fieldset>
      <fieldset>
        <legend>Persistence</legend>
        <button id="save-settings" class="primary">Save Settings</button>
        <p class="hint">Writes <code>~/.spit_settings.json</code> on the Pi.</p>
      </fieldset>
    </div>
  </details>

  <script>
    // Static-render fallback: draws compass ticks if app.js never loads
    // (e.g. in a sandboxed preview pane). app.js's buildTicks is idempotent.
    (function () {
      var SVG_NS = "http://www.w3.org/2000/svg";
      function ticks(container) {
        if (!container || container.childElementCount > 0) return;
        for (var i = 0; i < 36; i++) {
          var major = i % 9 === 0;
          var line = document.createElementNS(SVG_NS, "line");
          line.setAttribute("x1", 0); line.setAttribute("y1", -100);
          line.setAttribute("x2", 0); line.setAttribute("y2", major ? -88 : -94);
          line.setAttribute("transform", "rotate(" + (i * 10) + ")");
          if (major) line.setAttribute("class", "major");
          container.appendChild(line);
        }
      }
      ticks(document.getElementById("ticks"));
      ticks(document.getElementById("knob-ticks"));
    })();
  </script>
  <script src="vendor/mqtt.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
